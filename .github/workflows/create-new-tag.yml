name: Create new tag

# Path A — Actions → Run workflow (on develop): build, tag, release + .tgz asset
# Path B — Releases → publish release from an existing tag: build and attach .tgz to that release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_LABEL: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Normalize tag name
        run: |
          LABEL="${RELEASE_LABEL}"
          [[ "$LABEL" == v* ]] || LABEL="v${LABEL}"
          echo "RELEASE_LABEL=${LABEL}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client package
        working-directory: client
        env:
          HUSKY: "0"
        run: |
          VERSION="${RELEASE_LABEL#v}"
          PACKAGE_NAME="openg2p-notification-${VERSION}.tgz"

          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          npm pack
          cp openg2p-notification-*.tgz "/tmp/${PACKAGE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Upload package (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: /tmp/${{ env.PACKAGE_NAME }}

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_LABEL}" >/dev/null 2>&1; then
            echo "::error::Tag ${RELEASE_LABEL} already exists on the remote."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_LABEL}" -m "chore(client): ${RELEASE_LABEL}"
          git push origin "refs/tags/${RELEASE_LABEL}"

      - name: Create GitHub Release and attach package
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_LABEL }}
          name: ${{ env.RELEASE_LABEL }}
          files: /tmp/${{ env.PACKAGE_NAME }}
          generate_release_notes: true

      - name: Attach package to existing release
        if: github.event_name == 'release'
        run: gh release upload "${RELEASE_LABEL}" "/tmp/${PACKAGE_NAME}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}