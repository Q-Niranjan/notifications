name: Create new tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client package
        working-directory: client
        env:
          HUSKY: "0"
        run: |
          VERSION="${RELEASE_LABEL#v}"
          PACKAGE_NAME="openg2p-notification-${VERSION}.tgz"

          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          npm pack
          cp openg2p-notification-*.tgz "/tmp/${PACKAGE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: /tmp/${{ env.PACKAGE_NAME }}