name: Create new tag

# Auto: push tag v1.0.0  |  Manual: Actions → Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for commit message (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client package
        working-directory: client
        env:
          HUSKY: "0"
        run: |
          npm ci
          npm run build
          npm pack
          cp openg2p-notification-*.tgz /tmp/package.tgz

      - name: Commit tarball
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"

          rm -f client/*.tgz
          cp /tmp/package.tgz client/

          git add client/*.tgz
          git commit -m "chore(client): build package for ${RELEASE_LABEL}"
          git push origin "HEAD:$BRANCH"